name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test on py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Smoke test — demo mode
        run: python opslens.py --demo --no-color

      - name: Smoke test — real host
        run: |
          python opslens.py --no-color --html report.html --md report.md
          test -s report.html
          test -s report.md

      - name: Install as package
        run: |
          pip install .
          opslens version
